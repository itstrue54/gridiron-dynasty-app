name: CI

on:
  push:
    branches: [ main, 'feat/**', 'fix/**', 'tune/**', 'exp/**' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  guards:
    name: Architecture guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Both guards ignore comment lines - otherwise the documentation that
      # explains a rule trips the rule that it explains.
      - name: engine must not import android
        run: |
          HITS=$(grep -rn --include=*.kt "^import android\." engine/src 2>/dev/null \
                 | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(\*|//|/\*)' || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "::error::engine imported android.* - that belongs in app or data (SPEC 2.2)"
            exit 1
          fi
          echo "OK: engine is Android-free"

      - name: engine must be deterministic
        run: |
          HITS=$(grep -rnE --include=*.kt \
                 "Math\.random|java\.util\.Random|System\.currentTimeMillis|System\.nanoTime|UUID\.randomUUID|kotlin\.random\.Random\.Default" \
                 engine/src/main 2>/dev/null \
                 | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(\*|//|/\*)' || true)
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "::error::Nondeterministic call in :engine - use the injected Rng (SPEC 5.11)"
            exit 1
          fi
          echo "OK: engine is deterministic"

  engine:
    name: Engine unit tests
    runs-on: ubuntu-latest
    needs: guards
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run engine tests
        # The command-line tool has no tests of its own, but it calls the
        # engine's API and has to keep compiling against it.
        run: ./gradlew :engine:test :data:test :engine-cli:build --stacktrace
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: engine-test-report
          path: engine/build/reports/tests/

  android:
    name: Android build
    runs-on: ubuntu-latest
    needs: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace
