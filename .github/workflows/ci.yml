name: CI

on:
  push:
    branches: [ main, 'feat/**', 'fix/**', 'tune/**', 'exp/**' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  guards:
    name: Architecture guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: engine must not import android
        run: |
          if [ -d engine/src ] && grep -rn --include=*.kt "^import android\." engine/src; then
            echo "::error::engine imported android.* - that belongs in app or data (SPEC 2.2)"
            exit 1
          fi
          echo "OK: engine is Android-free"

      - name: engine must be deterministic
        run: |
          if [ -d engine/src/main ] && grep -rnE --include=*.kt \
             "Math\.random|java\.util\.Random|System\.currentTimeMillis|System\.nanoTime|UUID\.randomUUID|kotlin\.random\.Random\.Default" \
             engine/src/main; then
            echo "::error::Nondeterministic call in engine - use the injected Rng (SPEC 5.11)"
            exit 1
          fi
          echo "OK: engine is deterministic"

  engine:
    name: Engine unit tests
    runs-on: ubuntu-latest
    needs: guards
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run engine tests
        run: |
          if ./gradlew projects | grep -q "engine"; then
            ./gradlew :engine:test --stacktrace
          else
            echo "engine module does not exist yet - skipping"
          fi

  android:
    name: Android build
    runs-on: ubuntu-latest
    needs: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace
